name: 🚀 Deploy Producción Optimizada (Hostinger)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  APP_URL_PROD: xn--mundodelcumpleao-lub.com
  DEPLOY_CLEAN_TOKEN: ${{ secrets.DEPLOY_CLEAN_TOKEN }}

jobs:
  # ======================================================
  # JOB 1: PRUEBAS DE CALIDAD (PHPUNIT + CYPRESS)
  # ======================================================
  quality-gates:
    name: 🧪 1. Pruebas (Backend & E2E)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Descargar Código Fuente
        uses: actions/checkout@v5

      - name: 🐘 2. Configurar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, dom, curl, mbstring, zip
          tools: composer

      - name: 💾 3. Restaurar Caché de Vendor
        id: cache-vendor
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          path: vendor

      - name: ⬇️ 4. Instalar Dependencias Backend (Dev + Prod)
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --optimize-autoloader
        env:
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1

      - name: 📄 5. Generar archivo .env y Key (Solo CI)
        run: |
          printf '%s\n' "${{ secrets.ENV_FILE }}" > .env
          php artisan key:generate

      - name: 🟢 6. Configurar Node.js y Caché NPM
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 7. Instalar Dependencias NPM (CI)
        run: npm ci

      - name: 🎨 8. Compilar Assets (Vite Build)
        run: |
          rm -f public/hot
          npm run build

      - name: 🧪 9. Ejecutar Pruebas PHPUnit (Backend Quality Gate)
        run: |
          touch database/testing.sqlite
          php artisan migrate:fresh --env=testing --force
          php artisan test --stop-on-failure

      - name: 💻 10. Ejecutar Pruebas Cypress E2E (Frontend Quality Gate)
        run: npm run test
        env:
          APP_URL: http://127.0.0.1:8000
          CYPRESS_BASE_URL: http://127.0.0.1:8000
          CYPRESS_VITE_API_URL: http://127.0.0.1:8000
          VITE_API_URL: http://127.0.0.1:8000

  # ======================================================
  # JOB 2: EMPAQUETADO DE PRODUCCIÓN (ARTIFACT)
  # ======================================================
  build-artifact:
    name: 📦 2. Compilar y Empaquetar
    needs: quality-gates
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar Código Fuente
        uses: actions/checkout@v5

      - name: 🐘 Configurar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, dom, curl, mbstring, zip
          tools: composer

      - name: 🧹 11. Instalar Dependencias Solo Producción
        run: composer install --prefer-dist --no-dev --optimize-autoloader
        env:
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1

      - name: 📦 12. Crear Vendor.zip
        run: |
          echo "Comprimiendo vendor para acelerar subida FTP..."
          zip -rq vendor.zip vendor/

      - name: 🟢 Configurar Node.js y Caché NPM
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: 🎨 13. Compilar Assets (Vite)
        run: |
          rm -f public/hot
          npm ci
          npm run build

      - name: 🧹 14. Limpiar Workspace
        run: |
          echo "Eliminando archivos innecesarios para reducir tiempo de subida..."
          rm -rf node_modules
          rm -rf tests
          rm -rf vendor
          rm -rf storage/framework/cache/data

      - name: 📤 15. Guardar Artifact listo para desplegar
        uses: actions/upload-artifact@v5
        with:
          name: release-package
          path: |
            .
            !.git*
            !.github
            !.env*
          retention-days: 1

  # ======================================================
  # JOB 3: DESPLIEGUE A HOSTINGER (REINTENTABLE SIN COMPILAR)
  # ======================================================
  deploy:
    name: 🚀 3. Subir a Hostinger
    needs: build-artifact
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar paquete compilado
        uses: actions/download-artifact@v5
        with:
          name: release-package

      - name: 📤 16. Subir Backend (Solo cambios, sin tocar .env ni fotos)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          server-dir: /
          exclude: |
            .git*
            .git/**
            .github/**
            .env
            .env.*
            node_modules/**
            database/*.sqlite
            tests/**
            vendor/**
            public/**
            storage/**

      - name: 📤 17. Subir Frontend (Public + Build siempre actualizado)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: public/
          server-dir: /public_html/
          exclude: |
            assets/
            storage
            storage/**

      # ======================================================
      # FASE 4: POST-DESPLIEGUE (SSH CON RESPALDO HTTP REAL)
      # ======================================================
      - name: 🔐 18A. Tareas Finales por SSH
        id: ssh-deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: 65002
          key: ${{ secrets.PRIVATE_KEY_SSH }}
          command_timeout: 20s
          script: |
            PROJECT_ROOT="/home/${{ secrets.SSH_USER }}/domains/xn--mundodelcumpleao-lub.com"
            cd "$PROJECT_ROOT" || exit 1
            if [ -f vendor.zip ]; then
              unzip -o vendor.zip -d . > /dev/null
              rm vendor.zip
            fi
            mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
            rm -f public_html/storage
            php artisan storage:link-html
            chmod -R 775 storage bootstrap/cache
            php artisan optimize:clear

      - name: 🌐 18B. Tareas Finales vía HTTP (Respaldo)
        if: steps.ssh-deploy.outcome != 'success'
        run: |
          echo "🚀 Ejecutando tareas post-despliegue en Laravel..."
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "https://${{ env.APP_URL_PROD }}/api/deploy-post-tasks" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_CLEAN_TOKEN }}" \
            -H "Accept: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Respuesta ($HTTP_CODE): $BODY"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Error en tareas post-despliegue."
            exit 1
          fi
          echo "✅ Despliegue completado con éxito."
