name: 🚀 Deploy Producción Optimizada (Hostinger)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# Variables de entorno globales
env:
  APP_URL_PROD: xn--mundodelcumpleao-lub.com
  DEPLOY_CLEAN_TOKEN: ${{ secrets.DEPLOY_CLEAN_TOKEN }}

jobs:
  # ======================================================
  # JOB 1: PRUEBAS DE CALIDAD (PHPUNIT + CYPRESS)
  # ======================================================
  quality-gates:
    name: 🧪 1. Pruebas (Backend & E2E)
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # FASE 1: CONFIGURACIÓN Y CONSTRUCCIÓN (BUILD)
      # ======================================================
      - name: 📥 1. Descargar Código Fuente
        uses: actions/checkout@v4

      - name: 🐘 2. Configurar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, dom, curl, mbstring, zip
          tools: composer

      # --- Optimización de Caché para Composer ---
      - name: 💾 3. Restaurar Caché de Vendor
        id: cache-vendor
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          path: vendor

      - name: ⬇️ 4. Instalar Dependencias Backend (Dev + Prod)
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --optimize-autoloader
        env:
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1

      - name: 📄 5. Generar archivo .env y Key (CI)
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          php artisan key:generate

      # 📦 6. Instalar Dependencias Frontend (NPM ci)
      - name: 📦 6. Instalar Dependencias NPM (CI)
        run: npm ci

      # 🎨 7. Compilar Assets (Vite Build)
      - name: 🎨 7. Compilar Assets (Vite Build)
        run: npm run build

      # ======================================================
      # FASE 2: QUALITY GATES (PRUEBAS UNIFICADAS)
      # ======================================================

  # ======================================================
  # JOB 2: EMPAQUETADO DE PRODUCCIÓN (ARTIFACT)
  # ======================================================
  build-artifact:
    name: 📦 2. Compilar y Empaquetar
    needs: quality-gates # Solo corre si pasan las pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🐘 Configurar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, dom, curl, mbstring, zip
          tools: composer

      - name: 🧹 10. Limpiar Dependencias de Desarrollo
        run: composer install --prefer-dist --no-dev --optimize-autoloader

      # 📦 11. Crear Vendor.zip
      - name: 📦 11. Crear Vendor.zip
        id: create-zip
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: |
          echo "Comprimiendo vendor para acelerar subida FTP..."
          zip -r vendor.zip vendor/

      - name: 🎨 Compilar Assets (Vite)
        run: |
          npm ci
          npm run build

      # ======================================================
      # FASE 3: LIMPIEZA PRE-DESPLIEGUE Y DESPLIEGUE
      # ======================================================

      - name: 🧹 12. Limpiar Workspace
        run: |
          echo "Eliminando archivos innecesarios para reducir tiempo de subida..."
          rm -rf node_modules 
          rm -rf tests 
          rm -rf vendor
          rm -rf storage/framework/cache/data 
          # rm -rf resources/js # Opcional si solo necesitas el build
          # rm -rf resources/js

      - name: 📤 Guardar Artifact listo para desplegar
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            .
            !.git*
            !.github
            !.env*
          retention-days: 1 # Se borra solo en 24h para no gastar espacio

  # ======================================================
  # JOB 3: DESPLIEGUE A HOSTINGER (REINTENTABLE SIN COMPILAR)
  # ======================================================
  deploy:
    name: 🚀 3. Subir a Hostinger
    needs: build-artifact # Espera el paquete compilado
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Descargar paquete compilado
        uses: actions/download-artifact@v4
        with:
          name: release-package

      - name: 📤 13. Subir Backend (Core de Laravel)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: / # Sube a la raíz del usuario (donde vive artisan)
          exclude: |
            public/ 
            .git*
            .github
            .env*
            node_modules
            tests
            vendor # Excluido porque subimos el .zip

            # Archivos que NO queremos sobrescribir en el servidor si ya existen:
            storage/logs/
            storage/app/public/
            storage/framework/sessions/*
            storage/framework/cache/data/*

      - name: 📤 14. Subir Frontend (Archivos Públicos)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: public/ # Origen: Carpeta compilada local
          server-dir: /public_html/ # Destino: Carpeta pública del hosting

      # ======================================================
      # FASE 4: POST-DESPLIEGUE (SSH)
      # ======================================================

      # 1. Sonda de disponibilidad del puerto SSH (máximo 5 segundos)
      - name: 🔍 15 Verificar disponibilidad de SSH
        id: check-ssh
        run: |
          if nc -z -w 5 "${{ secrets.SSH_HOST }}" 65002 2>/dev/null; then
            echo "available=true" >> $GITHUB_OUTPUT
            echo "✅ Puerto SSH 65002 abierto y disponible."
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "⚠️ SSH no disponible o bloqueado. Se usará el método HTTP de respaldo."
          fi

      # 2. Camino A: Si SSH responde, ejecuta el script tradicional
      - name: 🔐 15A. Tareas Finales por SSH
        id: ssh-deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: 65002
          key: ${{ secrets.PRIVATE_KEY_SSH }}
          command_timeout: 20s

          script: |
            # --- CONFIGURACIÓN DE RUTAS ---
            # Definimos la ruta absoluta para evitar errores de navegación
            PROJECT_ROOT="/home/${{ secrets.SSH_USER }}/domains/xn--mundodelcumpleao-lub.com"

            echo "📍 Navegando a la raíz del proyecto: $PROJECT_ROOT"
            cd "$PROJECT_ROOT" || { echo "❌ ERROR FATAL: No se pudo entrar a la carpeta."; exit 1; }

            # --- 1. GESTIÓN DE DEPENDENCIAS (VENDOR) ---
            if [ -f vendor.zip ]; then
              echo "📦 vendor.zip detectado. Descomprimiendo..."
              unzip -o vendor.zip -d . > /dev/null # > /dev/null silencia la salida masiva
              rm vendor.zip
              echo "✅ Vendor actualizado y zip eliminado."
            else
              echo "⚠️ No se encontró vendor.zip. Omitiendo descompresión."
            fi

            # --- 2. ENLACE SIMBÓLICO (STORAGE) ---
            echo "🔗 Configurando Storage Link..."
            # Borramos el enlace existente en public_html para recrearlo limpio
            rm -f public_html/storage 
            php artisan storage:link-html

            # --- 3. LIMPIEZA Y OPTIMIZACIÓN DE CACHÉ ---
            echo "🧹 Ejecutando limpieza de caché de Laravel..."
            chmod -R 775 storage bootstrap/cache
            # Es vital ejecutar esto AQUÍ y no en el Build para que las rutas sean las del servidor
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan optimize 

            echo "🚀 ¡Despliegue completado con éxito!"
      # 3. Camino B: Si SSH falla o está deshabilitado, ejecuta vía Webhook HTTP
      - name: 🌐 15b. Tareas Finales vía HTTP (Respaldo)
        if: steps.ssh-deploy.outcome != 'success'
        run: |
          echo "⚠️ SSH falló o no está habilitado para este usuario. Ejecutando respaldo HTTP..."
          curl --fail --silent --show-error -X POST "https://${{ env.APP_URL_PROD }}/deploy-post-tasks" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_CLEAN_TOKEN }}" \
            -H "Accept: application/json"
          echo ""
          echo "✅ Despliegue completado mediante respaldo HTTP."
